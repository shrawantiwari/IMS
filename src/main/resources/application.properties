spring.application.name=inventory-management-system
# 1. Database Connection URL
# Format: jdbc:postgresql://[host]:[port]/[database_name]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/IMS}

# 2. Database Credentials
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}


# 3. JDBC Driver Class (Optional in modern Spring Boot, as it auto-detects)
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. Hibernate/JPA Configuration
# Controls how the database schema is managed (e.g., create, update, validate, none)
spring.jpa.hibernate.ddl-auto=update

# Specifies the dialect for SQL generation (Optional in newer versions)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 5. Logging (Optional)
# Set to true to see the SQL queries generated by Hibernate in your console
spring.jpa.show-sql=true

# 6. SLF4J Logging Configuration (Industry-level)
# Application logging level (DEBUG for development, INFO for production)
logging.level.root=INFO
logging.level.com.inventory=DEBUG

# Spring Framework logging levels
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data=INFO

# Database logging levels
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.postgresql=INFO

# Log file configuration
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10
