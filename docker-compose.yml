services:

  postgres:
    image: postgres:17
    container_name: ims-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: IMS
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d IMS"]
      interval: 10s
      timeout: 5s
      retries: 5


  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile

    container_name: ims-inventory-service
    restart: unless-stopped

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/IMS
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile

    container_name: ims-auth-service
    restart: unless-stopped

    ports:
      - "9000:9000"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/IMS
      DB_USERNAME: postgres
      DB_PASSWORD: postgres


  nginx:
    image: nginx:latest
    container_name: ims-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      inventory-service:
        condition: service_started


volumes:
  postgres-data: