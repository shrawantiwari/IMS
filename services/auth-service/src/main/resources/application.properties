spring.application.name=auth-service
server.port=9000

# 1. Database Connection URL
# Format: jdbc:postgresql://[host]:[port]/[database_name]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/IMS}

# 2. Database Credentials
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# 3. JDBC Driver Class
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. Hibernate/JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enterprise defaults (override via env vars: IMS_AUTH_*)
# Access/ID tokens short-lived to reduce exposure; keep refresh tokens longer with rotation in future.
ims.auth.access-token-ttl=${IMS_AUTH_ACCESS_TOKEN_TTL:2m}
ims.auth.id-token-ttl=${IMS_AUTH_ID_TOKEN_TTL:2m}
# Refresh token lifetime reasonable for SSO but still manageable; consider rotation for production.
ims.auth.refresh-token-ttl=${IMS_AUTH_REFRESH_TOKEN_TTL:30d}
# Single active session by default for enterprise control; set >1 to allow multiple concurrent sessions.
ims.auth.max-sessions-per-user=${IMS_AUTH_MAX_SESSIONS_PER_USER:1}
# Active session record expiry (hours) — keeps session metadata shorter than refresh TTL to limit lingering sessions.
ims.auth.session-expiry-hours=${IMS_AUTH_SESSION_EXPIRY_HOURS:12}

# 5. Logging
spring.jpa.show-sql=true

logging.level.root=INFO
logging.level.com.ims.authserver=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.postgresql=INFO

logging.level.org.springframework.security=INFO
logging.level.org.springframework.oauth2=INFO
